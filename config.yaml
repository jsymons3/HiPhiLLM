# Form Field Detection Model Configuration

data:
  # Directory containing interactive PDFs with AcroFields (training source)
  acro_pdf_dir: "data/acro_pdfs"
  # Directory containing flat PDFs for inference
  flat_pdf_dir: "data/flat_pdfs"
  # Directory for extracted training data (images + annotations)
  processed_dir: "data/processed"
  # Train/validation split ratio
  train_split: 0.8
  # DPI for rendering PDF pages to images
  render_dpi: 150

model:
  # Backbone: resnet50 or resnet101
  backbone: "resnet50"
  # Number of field type classes (update based on your forms)
  # Default classes: text_field, checkbox, radio_button, button, signature, dropdown, list_box
  num_classes: 8  # 7 field types + 1 background
  # Pretrained backbone weights
  pretrained: true

training:
  batch_size: 4
  num_workers: 2
  learning_rate: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  num_epochs: 50
  # Learning rate scheduler step size (epochs)
  lr_step_size: 15
  lr_gamma: 0.1
  # Device: "cuda" or "cpu"
  device: "auto"
  # Directory to save model checkpoints
  checkpoint_dir: "checkpoints"
  # Save checkpoint every N epochs
  save_every: 5

inference:
  # Confidence threshold for predictions
  confidence_threshold: 0.5
  # Non-maximum suppression IoU threshold
  nms_threshold: 0.3
  # Output directory for predictions
  output_dir: "output"
